<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cool innovative photo sharing space">
  <meta name="author" content="Dominique Mitchell">
  <meta name="keywords" content="photo, sharing, innovative">
  <link rel="stylesheet" href="./pages/index.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <title>Spots</title>
</head>
<body>
<div class="page">
 <header class="header">
  <img src="./images/Spots/logo (1).svg" alt="Spots Logo" class="header__logo">
</header>
 <main class="content">
  <section class="profile page__secction">
  <img src="./images/Spots/avatar.jpg" alt="Profile__avatar"/>
  <div class="profile__column">
    <h1 class="profile__name ">Bessie Colman</h1>
    <p class="profile__description">Civil Aviator</p>
     <button type="button" class="profile__edit-button">
      <img src="./images/Spots/Group 2.svg" alt="Pencil icon" />Edit Profile</button>
      </div>
     <button type="button" class="profile__add-button">
      <img src="./images/Spots/Plus icon.svg" alt="Plus icon" />New Post
    </button>
  </section>
  <section class="cards>"><ul class="cards__list">
    <li class="card"><img src="./images/Spots/1-photo-by-moritz-feldmann-from-pexels.jpg" 
      alt="Val Thorens" 
      class="card__image"/>     
      <div class="card__content">
        <h2 class="card__title">Val Thorens</h2>
        <button type="button" class="card__like-button"></button>
      </div>
    </li>
  </ul>
</section>
 </main>
 <footer class="footer"></footer>
</div>
</body>
</html>
